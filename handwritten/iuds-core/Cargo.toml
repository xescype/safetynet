[package]
name = "iuds-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.24"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-manual-roots",
] }
axum = "0.8"

